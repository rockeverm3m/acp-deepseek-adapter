# cc-connect config — DeepSeek TUI integration
#
# Merge into your existing ~/.cc-connect/config.toml
#
# Setup:
#   1. Make adapter executable: chmod +x acp_deepseek_adapter.py
#   2. Run: cc-connect
#   3. Chat with the bot in Feishu/WeChat/Discord

language = "zh"

[[projects]]
name = "deepseek"

[projects.auto_compress]
enabled = true
max_tokens = 100000
min_gap_mins = 15

# ── Agent: ACP protocol ──────────────────────────────────────────
[projects.agent]
type = "acp"

[projects.agent.options]
command = "python3"
args = ["acp_deepseek_adapter.py"]
work_dir = "."

# Optional: environment variable overrides
# env = { DEEPSEEK_BIN = "~/deepseek", DEEPSEEK_WORKDIR = "~/my-project" }

# ── Platform: Feishu ─────────────────────────────────────────────
[[projects.platforms]]
type = "feishu"

[projects.platforms.options]
app_id = "cli_xxxxxxxxxxxx"
app_secret = "xxxxxxxxxxxxxxxxxxxxxxxxxx"
